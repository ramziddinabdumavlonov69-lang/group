<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeBot Logo</title>
<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #EAF3FF, #FFFFFF);
    font-family: 'Segoe UI', sans-serif;
}

.logo-box {
    width: 260px;
    height: 260px;
    background: white;
    border-radius: 40px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.08);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    position: relative;
}

.lock-circle {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4A90E2, #6FB1FF);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 50px;
    color: white;
    box-shadow: 0 10px 25px rgba(74,144,226,0.4);
}

.logo-text {
    margin-top: 20px;
    font-size: 22px;
    font-weight: 600;
    color: #2A2A2A;
    letter-spacing: 1px;
}

.sub-text {
    font-size: 14px;
    color: #6A6A6A;
    margin-top: 5px;
}
</style>
</head>
<body>

<div class="logo-box">
    <div class="lock-circle">🔐</div>
    <div class="logo-text">SafeBot</div>
    <div class="sub-text">Secure Digital Vault</div>
</div>

</body>
</html>
