<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save Storage Bot</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0f172a;color:white;padding:30px}
.container{max-width:1100px;margin:auto}
h1{font-size:30px;margin-bottom:25px;text-align:center}
.card{background:#1e293b;padding:25px;border-radius:15px;margin-bottom:25px;box-shadow:0 10px 30px rgba(0,0,0,0.4)}
.card h2{margin-bottom:15px;font-size:20px}
input, textarea{
width:100%;padding:12px;margin-bottom:15px;
border:none;border-radius:8px;
background:#334155;color:white;font-size:14px
}
textarea{resize:none;height:100px}
button{
padding:12px 25px;border:none;border-radius:8px;
background:#22c55e;color:white;font-weight:600;
cursor:pointer;transition:0.3s
}
button:hover{background:#16a34a}
button:disabled{opacity:0.6;cursor:not-allowed}
.file-box{
border:2px dashed #475569;padding:25px;
text-align:center;border-radius:10px;margin-bottom:15px
}
.search-box{display:flex;gap:10px}
.search-box input{flex:1}
.result{margin-top:15px;background:#0f172a;padding:15px;border-radius:10px;max-height:300px;overflow:auto}
.item{margin-bottom:10px;padding:10px;background:#1e293b;border-radius:8px}
.alert{
padding:10px 15px;margin-bottom:15px;border-radius:8px;font-weight:500
}
.success{background:#14532d}
.error{background:#7f1d1d}
.loading{opacity:0.6;pointer-events:none}
.progress{
height:6px;background:#334155;border-radius:10px;overflow:hidden;margin-top:10px
}
.progress-bar{
height:100%;width:0;background:#22c55e;transition:0.2s
}
@media(max-width:768px){
.search-box{flex-direction:column}
}
</style>
</head>
<body>

<div class="container">

<h1>💾 Save Storage Bot Panel</h1>

<div id="alertBox"></div>

<!-- DATA SAVE -->
<div class="card">
<h2>📝 Ma'lumot Saqlash</h2>
<input type="text" id="saveKey" placeholder="Kalit kiriting...">
<textarea id="saveValue" placeholder="Ma'lumot yozing..."></textarea>
<button id="saveBtn">Saqlash</button>
</div>

<!-- FILE UPLOAD -->
<div class="card">
<h2>📂 Fayl Yuklash</h2>
<div class="file-box">
<input type="file" id="fileInput">
</div>
<button id="uploadBtn">Faylni Saqlash</button>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
</div>

<!-- SEARCH -->
<div class="card">
<h2>🔎 Qidirish</h2>
<div class="search-box">
<input type="text" id="searchInput" placeholder="Qidirish...">
<button id="searchBtn">Qidirish</button>
</div>
<div class="result" id="resultBox">
Natijalar shu yerda chiqadi...
</div>
</div>

</div>

<script>
const alertBox = document.getElementById("alertBox");
const resultBox = document.getElementById("resultBox");

function showAlert(message, type="success"){
    alertBox.innerHTML = `<div class="alert ${type}">${message}</div>`;
    setTimeout(()=>alertBox.innerHTML="",3000);
}

function createItem(key,value,time){
    const div = document.createElement("div");
    div.className="item";

    div.innerHTML = `
        <strong>Kalit:</strong> ${key}<br>
        <strong>Ma'lumot:</strong> ${value}<br>
        <small>${time}</small>
    `;
    return div;
}

/* SAVE DATA */
document.getElementById("saveBtn").onclick = async ()=>{
    const key = document.getElementById("saveKey").value.trim();
    const value = document.getElementById("saveValue").value.trim();

    if(!key || !value){
        showAlert("Barcha maydonlarni to‘ldiring!","error");
        return;
    }

    try{
        const res = await fetch("/save",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({key,value})
        });

        const data = await res.json();

        if(data.error) throw new Error(data.error);

        showAlert("Ma'lumot saqlandi ✅");
        document.getElementById("saveKey").value="";
        document.getElementById("saveValue").value="";
    }catch(err){
        showAlert(err.message,"error");
    }
};

/* SEARCH */
async function search(){
    const keyword = document.getElementById("searchInput").value.trim();
    if(!keyword) return;

    resultBox.innerHTML="Yuklanmoqda...";

    const res = await fetch("/search",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({keyword})
    });

    const data = await res.json();
    resultBox.innerHTML="";

    if(data.results.length===0){
        resultBox.innerHTML="❌ Hech narsa topilmadi";
        return;
    }

    data.results.forEach(item=>{
        resultBox.appendChild(createItem(item.key,item.value,item.created_at));
    });
}

document.getElementById("searchBtn").onclick=search;
document.getElementById("searchInput").addEventListener("keyup",search);

/* FILE UPLOAD */
document.getElementById("uploadBtn").onclick=()=>{
    const fileInput = document.getElementById("fileInput");
    if(fileInput.files.length===0){
        showAlert("Fayl tanlang!","error");
        return;
    }

    const formData = new FormData();
    formData.append("file",fileInput.files[0]);

    const xhr = new XMLHttpRequest();
    xhr.open("POST","/upload");

    xhr.upload.onprogress=(e)=>{
        const percent = (e.loaded/e.total)*100;
        document.getElementById("progressBar").style.width=percent+"%";
    };

    xhr.onload=()=>{
        document.getElementById("progressBar").style.width="0%";
        showAlert("Fayl muvaffaqiyatli saqlandi 📁");
        fileInput.value="";
    };

    xhr.onerror=()=>{
        showAlert("Xatolik yuz berdi","error");
    };

    xhr.send(formData);
};
</script>

</body>
</html>
